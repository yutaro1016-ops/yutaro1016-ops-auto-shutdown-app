name: Build Windows

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AutoShutdown --icon assets/app.ico src/main.py

      - name: Create distribution zip
        shell: pwsh
        run: Compress-Archive -Path dist/AutoShutdown.exe -DestinationPath AutoShutdown-v1.0.0-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoShutdown-win64
          path: |
            dist/AutoShutdown.exe
            AutoShutdown-v1.0.0-win64.zip

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoShutdown.exe
            AutoShutdown-v1.0.0-win64.zip
